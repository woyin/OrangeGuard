name: Release

on:
  push:
    tags: ["v*"]
  # Manual release: builds the selected commit and creates tag v<version>.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.1.0"
        required: true

permissions:
  contents: read

env:
  PLUGIN_ID: orangeguard
  # Linux plugins must load inside the official cpa image (Debian bookworm,
  # glibc 2.36), so they are built in the matching Go image, never on the
  # newer glibc of the hosted Ubuntu runners.
  LINUX_BUILD_IMAGE: golang:1.26-bookworm
  MAX_GLIBC: "2.36"
  # Tag pushes use the tag name; manual runs use the version input.
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build-linux:
    name: build linux/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Test and build in ${{ env.LINUX_BUILD_IMAGE }}
        run: |
          version="${RELEASE_VERSION#v}"
          docker run --rm -v "$PWD:/src" -w /src -e GOFLAGS=-buildvcs=false "$LINUX_BUILD_IMAGE" bash -euc "
            go test ./...
            CGO_ENABLED=1 go build -buildmode=c-shared \
              -ldflags '-X main.pluginVersion=${version}' -o staging/${PLUGIN_ID}.so .
            rm -f staging/*.h
            chown -R $(id -u):$(id -g) staging"
      - name: Check glibc requirement
        run: |
          need="$(objdump -T "staging/${PLUGIN_ID}.so" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "highest glibc symbol version: ${need}"
          if [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "plugin needs glibc ${need}, newer than ${MAX_GLIBC} in the cpa image"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lib-linux-${{ matrix.goarch }}
          path: staging/${{ env.PLUGIN_ID }}.so
          if-no-files-found: error

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # cgo cannot be cross-compiled without a target toolchain, so every
      # artifact is built on a runner of its own OS and architecture.
      matrix:
        include:
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, ext: dylib }
          - { runner: macos-latest, goos: darwin, goarch: arm64, ext: dylib }
          - { runner: windows-latest, goos: windows, goarch: amd64, ext: dll }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          version="${RELEASE_VERSION#v}"
          go build -buildmode=c-shared -ldflags "-X main.pluginVersion=${version}" \
            -o "staging/${PLUGIN_ID}.${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.goos }}-${{ matrix.goarch }}
          path: staging/${{ env.PLUGIN_ID }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: [build-linux, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: libs
          pattern: lib-*
      # Plugin-store layout read by cpa: <pluginID>_<version>_<goos>_<goarch>.zip
      # holding only the library at the zip root, plus a sha256 checksums.txt.
      - name: Package
        shell: bash
        run: |
          set -e
          version="${RELEASE_VERSION#v}"
          mkdir -p release
          for dir in libs/lib-*; do
            slug="${dir#libs/lib-}"; goos="${slug%%-*}"; goarch="${slug#*-}"
            lib="$(find "$dir" -maxdepth 1 -type f -name "${PLUGIN_ID}.*" | head -1)"
            ( cd "$(dirname "$lib")" && zip -q -X "$GITHUB_WORKSPACE/release/${PLUGIN_ID}_${version}_${goos}_${goarch}.zip" "$(basename "$lib")" )
          done
          ( cd release && sha256sum *.zip > checksums.txt )
          ls -la release
          cat release/checksums.txt
      - name: Resolve tag
        id: tag
        run: echo "tag=v${RELEASE_VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
