name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PLUGIN_ID: orangeguard

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # cgo cannot be cross-compiled without a target toolchain, so every
      # artifact is built on a runner of its own OS and architecture.
      matrix:
        include:
          - { runner: ubuntu-latest,    goos: linux,   goarch: amd64, ext: so }
          - { runner: ubuntu-24.04-arm, goos: linux,   goarch: arm64, ext: so }
          - { runner: macos-15-intel,   goos: darwin,  goarch: amd64, ext: dylib }
          - { runner: macos-latest,     goos: darwin,  goarch: arm64, ext: dylib }
          - { runner: windows-latest,   goos: windows, goarch: amd64, ext: dll }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -buildmode=c-shared -ldflags "-X main.pluginVersion=${version}" \
            -o "staging/${PLUGIN_ID}.${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.goos }}-${{ matrix.goarch }}
          path: staging/${{ env.PLUGIN_ID }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: libs
          pattern: lib-*
      # Plugin-store layout: <pluginID>_<version>_<goos>_<goarch>.zip holding
      # only the library at the root, plus SHA256 checksums.txt.
      - name: Package
        shell: bash
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for dir in libs/lib-*; do
            slug="${dir#libs/lib-}"; goos="${slug%%-*}"; goarch="${slug#*-}"
            lib="$(find "$dir" -maxdepth 1 -type f -name "${PLUGIN_ID}.*" | head -1)"
            ( cd "$(dirname "$lib")" && zip -q -X "$GITHUB_WORKSPACE/release/${PLUGIN_ID}_${version}_${goos}_${goarch}.zip" "$(basename "$lib")" )
          done
          ( cd release && sha256sum *.zip > checksums.txt )
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
