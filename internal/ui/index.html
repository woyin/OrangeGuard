<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrangeGuard</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
  --accent: #e8730c; --accent-soft: #fdf0e3; --ok: #1a8f4c; --ok-soft: #e6f5ec;
  --warn: #b45309; --warn-soft: #fef3e2; --bad: #c0362c; --bad-soft: #fde9e7;
  --chip: #eef1f5; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"] {
  --bg: #12141a; --panel: #1b1f27; --text: #e6e8ec; --muted: #98a1b2; --border: #2c323d;
  --accent: #f08a2c; --accent-soft: #3a2614; --ok: #4cc283; --ok-soft: #173126;
  --warn: #f2b24c; --warn-soft: #3a2c12; --bad: #f2776d; --bad-soft: #3d1c1a;
  --chip: #262c36; --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
body.embedded { background: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.status-line { color: var(--muted); font-size: 13px; }
main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 60px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
.panel h2 { margin: 0 0 4px; font-size: 16px; }
.panel h3 { margin: 18px 0 8px; font-size: 14px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
label.field > span { font-weight: 500; }
input[type=text], input[type=number], input[type=password], select, textarea { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 7px 10px; min-width: 0; width: 100%; color: var(--text); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; background: var(--panel); }
.card:hover { border-color: var(--accent); }
.card .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; word-break: break-all; }
.card .members { color: var(--muted); font-size: 13px; margin-top: 8px; word-break: break-all; }
.card.new { display: flex; align-items: center; justify-content: center; color: var(--accent); border-style: dashed; min-height: 110px; font-weight: 600; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.segmented button { border: 0; background: none; padding: 7px 12px; cursor: pointer; border-right: 1px solid var(--border); }
.segmented button:last-child { border-right: 0; }
.segmented button.active { background: var(--accent); color: #fff; }
.member { display: grid; grid-template-columns: 26px minmax(160px, 1fr) auto auto auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: var(--panel); }
.member.dragging { opacity: .5; }
.member.over { border-color: var(--accent); }
.handle { cursor: grab; color: var(--muted); text-align: center; user-select: none; }
.member .name { word-break: break-all; }
.member .meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.member .ctl { display: flex; gap: 6px; align-items: center; }
.member .ctl input { width: 64px; }
.picker { position: relative; }
.picker-list { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; max-height: 280px; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 10; }
.picker-item { padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.picker-item:hover, .picker-item.active { background: var(--accent-soft); }
.warnbox { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
.okbox { border-left: 3px solid var(--ok); background: var(--ok-soft); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: 13px; }
.preview { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.num { text-align: right; white-space: nowrap; }
.table-wrap { overflow-x: auto; }
details summary { cursor: pointer; color: var(--muted); margin: 12px 0 6px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
#toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 50; }
.toast { background: var(--text); color: var(--panel); padding: 10px 16px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 420px; }
.toast.error { background: var(--bad); color: #fff; }
.toast.warn { background: var(--warn); color: #fff; }
.login { max-width: 420px; margin: 80px auto; }
.empty { color: var(--muted); padding: 16px 0; text-align: center; }
.hidden { display: none !important; }
@media (max-width: 640px) {
  header { padding: 10px 12px; }
  main { padding: 12px 10px 60px; }
  .member { grid-template-columns: 22px 1fr; }
  .member .ctl { grid-column: 2; flex-wrap: wrap; }
}
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true"></span>OrangeGuard</h1>
  <nav id="tabs" role="tablist">
    <button data-tab="virtual" role="tab">组合模型</button>
    <button data-tab="guard" role="tab">防降级与监控</button>
    <button data-tab="cooldown" role="tab">冷却与设置</button>
  </nav>
  <div class="spacer"></div>
  <span class="status-line" id="status-line"></span>
  <button class="btn small" id="refresh">刷新</button>
</header>
<div id="toasts" aria-live="polite"></div>
<main id="main">
  <section class="panel login hidden" id="login">
    <h2>需要管理密钥</h2>
    <p class="hint">未能从 CPA 管理中心读取登录状态。请输入 cpa 的管理密钥（仅保存在本标签页的会话中）。</p>
    <div class="row"><input type="password" id="login-key" placeholder="management key" autocomplete="off"><button class="btn primary" id="login-btn">登录</button></div>
    <p class="hint" id="login-error"></p>
  </section>
  <section id="view-virtual" class="hidden"></section>
  <section id="view-guard" class="hidden"></section>
  <section id="view-cooldown" class="hidden"></section>
</main>
<script>
"use strict";
const API = "/v0/management";
const STATUS = API + "/plugins/orangeguard/status";
const CONFIG = API + "/plugins/orangeguard/config";
const MODALITIES = ["text", "image", "audio", "video", "pdf"];
const STRATEGIES = [["fallback", "按顺序回退"], ["round-robin", "轮询"], ["random", "随机"], ["weighted", "加权"]];
const REASONS = { quota: "额度用尽", rate_limit: "限流", auth: "鉴权失败", not_found: "模型不可用", server_error: "上游错误", model_mismatch: "被降级" };

const state = { key: "", status: null, models: [], modelInfo: new Map(), modelsError: "", tab: "virtual", editing: null, filter: "", onlyMismatch: false };

/* ---------- helpers ---------- */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const $ = (id) => document.getElementById(id);
const clone = (v) => JSON.parse(JSON.stringify(v));
const lower = (s) => String(s || "").trim().toLowerCase();
function toast(msg, level) {
  const kind = level === true ? "error" : level || "";
  const t = h("div", { class: "toast " + kind, role: kind === "error" ? "alert" : "status" }, msg);
  $("toasts").append(t);
  setTimeout(() => t.remove(), kind ? 6000 : 2600);
}
function fmtTokens(n) {
  if (!n) return "";
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 ? 1 : 0) + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return String(n);
}
function fmtDuration(sec) {
  if (sec < 60) return sec + " 秒";
  if (sec < 3600) return Math.ceil(sec / 60) + " 分钟";
  return (sec / 3600).toFixed(1).replace(/\.0$/, "") + " 小时";
}
function fmtTime(iso) {
  if (!iso || iso.startsWith("0001")) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString();
}
function splitList(s) { return String(s || "").split(/[,，\s]+/).map((x) => x.trim()).filter(Boolean); }
function glob(pattern, name) {
  const re = new RegExp("^" + lower(pattern).replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$");
  return re.test(lower(name));
}

/* ---------- theme & auth (shared with the cpa management center) ---------- */
function panelStoredValue(name) {
  try {
    let raw = localStorage.getItem(name);
    if (!raw) return null;
    const prefix = "enc::v1::";
    if (raw.startsWith(prefix)) {
      const secret = new TextEncoder().encode("cli-proxy-api-webui::secure-storage|" + location.host + "|" + navigator.userAgent);
      const binary = atob(raw.slice(prefix.length));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i) ^ secret[i % secret.length];
      raw = new TextDecoder().decode(bytes);
    }
    return JSON.parse(raw);
  } catch (_) { return null; }
}
function applyTheme() {
  const t = panelStoredValue("cli-proxy-theme")?.state?.theme;
  const dark = t === "dark" || ((!t || t === "auto") && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
function panelKey() {
  const a = panelStoredValue("cli-proxy-auth")?.state?.managementKey;
  if (typeof a === "string" && a.trim()) return a.trim();
  const b = panelStoredValue("managementKey");
  if (typeof b === "string" && b.trim()) return b.trim();
  try { return sessionStorage.getItem("orangeguard.key") || ""; } catch (_) { return ""; }
}

async function api(method, path, body, key) {
  const res = await fetch(path, {
    method, cache: "no-store",
    headers: { Authorization: "Bearer " + (key ?? state.key), ...(body !== undefined ? { "Content-Type": "application/json" } : {}) },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) {}
  if (!res.ok) {
    const err = new Error((data && (data.message || data.error)) || text || res.statusText);
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ---------- data ---------- */
async function loadStatus() {
  state.status = await api("GET", STATUS);
  const line = $("status-line");
  const n = (state.status.config.virtual_models || []).length;
  line.textContent = (state.status.config.enabled ? "运行中" : "已停用") + " · " + n + " 个组合模型 · " + (state.status.config.guard.models || []).length + " 条防降级规则";
}

// cpa has no management endpoint listing every model with metadata, so the
// page uses a client API key from the configuration to read the public model
// lists: /v1/models for the owner, /v1beta/models for limits and modalities.
async function loadModels() {
  state.models = []; state.modelInfo = new Map(); state.modelsError = "";
  try {
    const cfg = await api("GET", API + "/config");
    const keys = (cfg && cfg["api-keys"]) || [];
    const key = keys.map((k) => typeof k === "string" ? k : (k && (k.key || k["api-key"]))).find(Boolean);
    if (!key) { state.modelsError = "cpa 未配置客户端 API Key，无法读取模型列表；可直接输入模型名。"; return; }
    const [openai, gemini] = await Promise.all([
      fetch("/v1/models", { headers: { Authorization: "Bearer " + key }, cache: "no-store" }).then((r) => r.ok ? r.json() : null).catch(() => null),
      fetch("/v1beta/models?key=" + encodeURIComponent(key), { cache: "no-store" }).then((r) => r.ok ? r.json() : null).catch(() => null),
    ]);
    for (const m of (openai && openai.data) || []) {
      if (!m || !m.id) continue;
      state.modelInfo.set(lower(m.id), { id: m.id, owner: m.owned_by || "" });
    }
    for (const m of (gemini && gemini.models) || []) {
      const id = String(m.name || "").replace(/^models\//, "");
      if (!id) continue;
      const info = state.modelInfo.get(lower(id)) || { id, owner: "" };
      info.context = m.inputTokenLimit || 0;
      info.output = m.outputTokenLimit || 0;
      info.inputModalities = (m.supportedInputModalities || []).map(lower);
      info.display = m.displayName && m.displayName !== id ? m.displayName : "";
      state.modelInfo.set(lower(id), info);
    }
    state.models = [...state.modelInfo.values()].sort((a, b) => a.id.localeCompare(b.id));
    if (!state.models.length) state.modelsError = "未能读取模型列表；可直接输入模型名。";
  } catch (e) {
    state.modelsError = "读取模型列表失败：" + e.message + "；可直接输入模型名。";
  }
}
const isVirtual = (id) => (state.status?.config.virtual_models || []).some((v) => lower(v.name) === lower(id));
function realModels() { return state.models.filter((m) => m.owner !== state.status?.config.provider && !isVirtual(m.id)); }

/* ---------- saving ---------- */
// The page edits the effective configuration and writes whole sections back
// through cpa's plugin config API, which saves config.yaml and hot-reloads
// the plugin. host-owned keys (enabled, priority, store) are never sent.
function prune(v) {
  if (Array.isArray(v)) return v.map(prune);
  if (v && typeof v === "object") {
    const out = {};
    for (const [k, x] of Object.entries(v)) {
      if (x === null || x === undefined || x === "") continue;
      if (Array.isArray(x) && !x.length && k !== "models" && k !== "virtual_models" && k !== "members") continue;
      out[k] = prune(x);
    }
    return out;
  }
  return v;
}
function compact(cfg) {
  const guard = clone(cfg.guard);
  guard.models = (guard.models || []).map((r) => {
    const out = { ...r };
    if (out.on_missing_model === guard.on_missing_model) delete out.on_missing_model;
    if (out.max_retries === null || out.max_retries === undefined) delete out.max_retries;
    return out;
  });
  const virtual_models = (cfg.virtual_models || []).map((vm) => {
    const out = clone(vm);
    out.members = out.members.map((m) => {
      const mm = { ...m };
      if (vm.strategy !== "weighted" || mm.weight === 1) delete mm.weight;
      if (!mm.max_retries) delete mm.max_retries;
      return mm;
    });
    if (!out.max_attempts) delete out.max_attempts;
    if (!out.guard) delete out.guard;
    if (!out.failover_on_client_error) delete out.failover_on_client_error;
    if (out.when_all_cooling === "soonest") delete out.when_all_cooling;
    const caps = out.capabilities || {};
    for (const k of ["context_length", "input_token_limit", "max_output_tokens"]) if (!caps[k]) delete caps[k];
    if (!caps.vision) delete caps.vision;
    if (caps.thinking && !(caps.thinking.levels || []).length && !caps.thinking.max) delete caps.thinking;
    return out;
  });
  return { guard, cooldown: cfg.cooldown, monitor: cfg.monitor, virtual_models };
}
async function save(cfg, message) {
  const body = prune(compact(cfg));
  await api("PATCH", CONFIG, body);
  const want = JSON.stringify((cfg.virtual_models || []).map((v) => v.name)) + JSON.stringify((cfg.guard.models || []).map((r) => r.model));
  for (let i = 0; i < 24; i++) {
    await new Promise((r) => setTimeout(r, 500));
    await loadStatus();
    const c = state.status.config;
    const got = JSON.stringify((c.virtual_models || []).map((v) => v.name)) + JSON.stringify((c.guard.models || []).map((r) => r.model));
    if (got === want) { toast(message || "已保存，配置已生效"); render(); return true; }
  }
  toast("已写入 config.yaml，但插件尚未加载新配置；请检查 cpa 日志中的 orangeguard: config 警告", true);
  render();
  return false;
}

/* ---------- shared widgets ---------- */
function modelMeta(id) {
  const info = state.modelInfo.get(lower(id));
  const chips = [];
  if (!info) chips.push(h("span", { class: "chip warn", title: "该名称不在 cpa 的模型列表中" }, "未知模型"));
  else {
    if (info.owner) chips.push(h("span", { class: "chip" }, info.owner));
    if (info.context) chips.push(h("span", { class: "chip", title: "上下文" }, fmtTokens(info.context)));
    if ((info.inputModalities || []).some((m) => m !== "text")) chips.push(h("span", { class: "chip", title: "输入模态" }, info.inputModalities.filter((m) => m !== "text").join("/")));
  }
  return chips;
}
function guardRuleFor(id, cfg) { return (cfg.guard.models || []).find((r) => glob(r.model, id) || (!r.model.includes("/") && glob(r.model, id.split("/").pop()))); }
function cooldownOf(id) { return (state.status?.cooldowns || []).find((c) => lower(c.model) === lower(id) && c.cooling_down); }
function cooldownChip(id) {
  const c = cooldownOf(id);
  if (!c) return h("span", { class: "chip ok" }, "可用");
  return h("span", { class: "chip warn", title: c.last_error || "" }, (REASONS[c.reason] || c.reason) + " · " + fmtDuration(c.remaining_seconds));
}
async function resetCooldown(model) {
  await api("POST", API + "/plugins/orangeguard/cooldown/reset", model ? { model } : {});
  await loadStatus(); render(); toast(model ? "已清除 " + model + " 的冷却" : "已清除全部冷却");
}

function modelPicker({ placeholder, exclude, onPick }) {
  const input = h("input", { type: "text", placeholder, autocomplete: "off" });
  const list = h("div", { class: "picker-list hidden" });
  const box = h("div", { class: "picker" }, input, list);
  let active = 0, items = [];
  const draw = () => {
    const q = lower(input.value);
    items = realModels().filter((m) => !exclude().has(lower(m.id)) && (!q || lower(m.id).includes(q) || lower(m.owner).includes(q))).slice(0, 60);
    const free = input.value.trim() && !state.modelInfo.has(q) && !exclude().has(q) ? input.value.trim() : "";
    list.replaceChildren(
      ...items.map((m, i) => h("div", { class: "picker-item" + (i === active ? " active" : ""), onmousedown: (e) => { e.preventDefault(); pick(m.id); } },
        h("span", { class: "mono" }, m.id), h("span", { class: "row" }, ...modelMeta(m.id)))),
      free ? h("div", { class: "picker-item", onmousedown: (e) => { e.preventDefault(); pick(free); } }, h("span", {}, "使用自定义名称 “" + free + "”"), h("span", { class: "chip warn" }, "未知模型")) : null,
      !items.length && !free ? h("div", { class: "empty" }, state.modelsError || "没有匹配的模型") : null,
    );
    list.classList.remove("hidden");
  };
  const pick = (id) => { onPick(id); input.value = ""; list.classList.add("hidden"); };
  input.addEventListener("focus", () => { active = 0; draw(); });
  input.addEventListener("input", () => { active = 0; draw(); });
  input.addEventListener("blur", () => setTimeout(() => list.classList.add("hidden"), 120));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { active = Math.min(active + 1, items.length - 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }

        h("tbody", {}, g.models.length ? g.models.map(ruleRow) : h("tr", {}, h("td", { colspan: "5", class: "empty" }, "没有规则：所有模型只监控，不拦截"))))),
      h("div", { class: "actions" },
        h("button", { class: "btn", onclick: () => { g.models.push({ model: "" }); draw(); } }, "+ 添加规则"),
        h("button", { class: "btn", onclick: () => { const have = new Set(g.models.map((r) => lower(r.model))); for (const pat of ["gpt-*", "chatgpt-*", "o1*", "o3*", "o4*", "deepseek-*", "glm-*"]) if (!have.has(pat)) g.models.push({ model: pat }); draw(); } }, "加入 OpenAI / DeepSeek / GLM 默认规则"),
        h("div", { class: "spacer" }),
        h("button", { class: "btn primary", onclick: async (e) => {
          if (g.models.some((r) => !r.model)) return toast("规则的模型不能为空", true);
          e.target.disabled = true;
          try { await save(cfg, "防降级规则已保存"); } catch (err) { toast("保存失败：" + err.message, true); } finally { e.target.disabled = false; }
        } }, "保存规则"))),
    h("div", { class: "panel" },
      h("div", { class: "row" }, h("h2", {}, "模型监控"), h("div", { class: "spacer" }),
        h("label", { class: "check" }, h("input", { type: "checkbox", checked: state.onlyMismatch, onchange: (e) => { state.onlyMismatch = e.target.checked; draw(); } }), "只看出现过降级的"),
        h("input", { type: "text", placeholder: "筛选模型", value: state.filter, style: "max-width:200px", oninput: (e) => { state.filter = e.target.value; const pos = e.target.selectionStart; draw(); const el = view.querySelector('input[placeholder="筛选模型"]'); el.focus(); el.setSelectionRange(pos, pos); } }),
        h("button", { class: "btn small", onclick: async () => { if (!confirm("清空监控统计？")) return; await api("POST", API + "/plugins/orangeguard/monitor/reset", {}); await loadStatus(); render(); } }, "清空统计")),
      h("p", { class: "hint" }, cfg.monitor.enabled
        ? "根据 cpa 的用量记录，被动统计每个模型实际是由哪个模型处理的，不拦截、不增加延迟。自 " + fmtTime(state.status.monitor_since) + " 起统计；cpa 重启后清零。发现降级率高的模型，点「保护」加入规则。"
        : "监控已关闭，可在「冷却与设置」中开启。"),
      h("div", { class: "table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "模型"), h("th", {}, "状态"), h("th", { style: "text-align:right" }, "请求"), h("th", { style: "text-align:right" }, "降级率"), h("th", {}, "实际处理的模型"), h("th", {}))),
        h("tbody", {}, (() => { const r = rows(); return r.length ? r : h("tr", {}, h("td", { colspan: "6", class: "empty" }, "暂无数据")); })())))));
  draw();
}

/* ---------- 冷却与设置 ---------- */
function renderCooldown() {
  const view = $("view-cooldown");
  const cfg = clone(state.status.config);
  const cd = cfg.cooldown;
  cd.enabled = cd.enabled !== false;
  cd.honor_retry_after = cd.honor_retry_after !== false;
  const sec = (key, label, hint) => h("label", { class: "field", title: hint || "" }, h("span", {}, label), h("input", { type: "number", min: "0", value: cd[key], oninput: (e) => { cd[key] = Math.max(0, parseInt(e.target.value) || 0); } }));
  const entries = state.status.cooldowns || [];
  view.replaceChildren(
    h("div", { class: "panel" },
      h("div", { class: "row" }, h("h2", {}, "当前冷却"), h("div", { class: "spacer" }), entries.some((c) => c.cooling_down) ? h("button", { class: "btn small", onclick: () => resetCooldown("") }, "全部解除") : null),
      h("p", { class: "hint" }, "按上游模型记录，所有组合模型共用。直接请求某个模型不受冷却限制。"),
      h("div", { class: "table-wrap" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "模型"), h("th", {}, "状态"), h("th", {}, "最近错误"), h("th", { style: "text-align:right" }, "失败/成功"), h("th", {}))),
        h("tbody", {}, entries.length ? entries.map((c) => h("tr", {},
          h("td", { class: "mono" }, c.model),
          h("td", {}, cooldownChip(c.model)),
          h("td", { style: "max-width:420px;word-break:break-all;font-size:12px", class: "hint" }, c.last_error || ""),
          h("td", { class: "num" }, c.failures + " / " + c.successes),
          h("td", {}, c.cooling_down ? h("button", { class: "btn small", onclick: () => resetCooldown(c.model) }, "解除") : null))) : h("tr", {}, h("td", { colspan: "5", class: "empty" }, "还没有记录")))))),
    h("div", { class: "panel" },
      h("h2", {}, "冷却策略"),
      h("p", { class: "hint" }, "成员失败后被跳过的时长（秒）。同类连续失败会按倍数延长，任何一次成功即清零。上游返回的重置时间（如 resets_in_seconds、retryDelay、try again in 20m）优先。"),
      h("div", { class: "row" },
        h("label", { class: "check" }, h("input", { type: "checkbox", checked: cd.enabled, onchange: (e) => { cd.enabled = e.target.checked; } }), "启用冷却"),
        h("label", { class: "check" }, h("input", { type: "checkbox", checked: cd.honor_retry_after, onchange: (e) => { cd.honor_retry_after = e.target.checked; } }), "使用上游返回的重置时间")),
      h("div", { class: "grid", style: "margin-top:12px" },
        sec("quota_seconds", "额度用尽"), sec("rate_limit_seconds", "限流 429"), sec("auth_seconds", "鉴权失败 401/403"),
        sec("not_found_seconds", "模型不可用 / 未定价"), sec("server_error_seconds", "上游 5xx / 超时"), sec("mismatch_seconds", "被降级"),
        h("label", { class: "field" }, h("span", {}, "连续几次 5xx 才冷却"), h("input", { type: "number", min: "1", value: cd.server_error_threshold, oninput: (e) => { cd.server_error_threshold = Math.max(1, parseInt(e.target.value) || 1); } })),
        h("label", { class: "field" }, h("span", {}, "连续失败延长倍数"), h("input", { type: "number", min: "1", step: "0.5", value: cd.backoff_multiplier, oninput: (e) => { cd.backoff_multiplier = Math.max(1, parseFloat(e.target.value) || 1); } })),
        sec("max_seconds", "最长冷却")),
      h("h3", {}, "模型监控"),
      h("label", { class: "check" }, h("input", { type: "checkbox", checked: cfg.monitor.enabled, onchange: (e) => { cfg.monitor.enabled = e.target.checked; } }), "根据用量记录统计每个模型实际由哪个模型处理（不拦截、不增加延迟）"),
      h("div", { class: "actions" }, h("button", { class: "btn primary", onclick: async (e) => {
        e.target.disabled = true;
        try { await save(cfg, "设置已保存"); } catch (err) { toast("保存失败：" + err.message, true); } finally { e.target.disabled = false; }
      } }, "保存设置"))));
}

/* ---------- shell ---------- */
function render() {
  for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("active", b.dataset.tab === state.tab);
  for (const t of ["virtual", "guard", "cooldown"]) $("view-" + t).classList.toggle("hidden", t !== state.tab || !state.status);
  if (!state.status) return;
  ({ virtual: renderVirtual, guard: renderGuard, cooldown: renderCooldown })[state.tab]();
}
async function boot(key) {
  state.key = key;
  try {
    await loadStatus();
  } catch (e) {
    if (e.status === 401 || e.status === 403 || !key) {
      $("login").classList.remove("hidden");
      $("login-error").textContent = key ? "管理密钥无效或已过期。" : "";
      $("tabs").classList.add("hidden");
      return;
    }
    $("status-line").textContent = "无法读取状态：" + e.message;
    return;
  }
  $("login").classList.add("hidden");
  $("tabs").classList.remove("hidden");
  render();
  await loadModels();
  render();
}
document.body.classList.toggle("embedded", window.parent !== window);
applyTheme();
try { state.tab = (location.hash.slice(1) || sessionStorage.getItem("orangeguard.tab") || "virtual").replace(/[^a-z]/g, "") || "virtual"; } catch (_) {}
if (!["virtual", "guard", "cooldown"].includes(state.tab)) state.tab = "virtual";
$("tabs").addEventListener("click", (e) => {
  const tab = e.target.dataset && e.target.dataset.tab;
  if (!tab) return;
  state.tab = tab; state.editing = null;
  try { sessionStorage.setItem("orangeguard.tab", tab); } catch (_) {}
  history.replaceState(null, "", "#" + tab);
  render();
});
$("refresh").addEventListener("click", async () => { try { await loadStatus(); await loadModels(); render(); toast("已刷新"); } catch (e) { toast(e.message, true); } });
$("login-btn").addEventListener("click", () => {
  const key = $("login-key").value.trim();
  if (!key) return;
  try { sessionStorage.setItem("orangeguard.key", key); } catch (_) {}
  boot(key);
});
$("login-key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("login-btn").click(); });
boot(panelKey());
</script>
